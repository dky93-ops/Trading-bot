type: app
name: nifty-quant-trading-bot
services:
  - name: web-and-engine
    git:
      repository: github.com/your-username/your-repo-name
      branch: main
    build:
      type: dockerfile
      dockerfile: Dockerfile
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    regions:
      - fra
    instance_types:
      type: nano
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: UPSTOX_ACCESS_TOKEN
        value: "YOUR_UPSTOX_ACCESS_TOKEN_HERE"
